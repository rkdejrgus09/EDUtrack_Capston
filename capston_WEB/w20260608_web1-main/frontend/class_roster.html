<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <title>EduTrack - 학년별 응시자 명단</title>
    <style>
        :root { --primary: #3182F6; --bg: #f4f7f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: var(--bg);
            padding-top: 112px;
        }

        /* ── 고정 헤더 ── */
        .roster-fixed-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .grade-tab-bar {
            display: flex;
            gap: 0;
            padding: 0 28px;
            border-bottom: 1px solid #e8ecf0;
        }

        .grade-tab {
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 600;
            color: #718096;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        .grade-tab:hover { color: var(--primary); }
        .grade-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .class-tab-bar {
            display: flex;
            gap: 8px;
            padding: 10px 28px;
            align-items: center;
            min-height: 52px;
        }

        .class-tab {
            padding: 6px 20px;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            background: #f4f7f9;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .class-tab:hover { background: #ebf8ff; color: var(--primary); }
        .class-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* ── 콘텐츠 ── */
        .roster-content {
            max-width: 860px;
            margin: 0 auto;
            padding: 28px 24px;
        }

        .roster-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 16px;
        }

        .roster-count {
            font-size: 13px;
            color: #718096;
            font-weight: 400;
            margin-left: 8px;
        }

        .roster-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }

        thead th {
            background: #f8f9fa;
            text-align: left;
            padding: 12px 16px;
            font-size: 13px;
            color: #4a5568;
            font-weight: 600;
            border-bottom: 2px solid #e8ecf0;
        }

        tbody td {
            padding: 13px 16px;
            font-size: 14px;
            color: #2d3748;
            border-bottom: 1px solid #f0f4f8;
            vertical-align: middle;
        }

        tbody tr:last-child td { border-bottom: none; }

        .score-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            color: white;
        }

        .empty-row td {
            text-align: center;
            color: #a0aec0;
            padding: 40px;
            font-size: 14px;
        }

        .loading-row td {
            text-align: center;
            color: #a0aec0;
            padding: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="roster-fixed-header">
        <div class="grade-tab-bar">
            <button class="grade-tab" id="gtab-1" onclick="selectGrade(1)">1학년</button>
            <button class="grade-tab" id="gtab-2" onclick="selectGrade(2)">2학년</button>
            <button class="grade-tab" id="gtab-3" onclick="selectGrade(3)">3학년</button>
        </div>
        <div class="class-tab-bar" id="classTabs">
            <span style="color:#a0aec0; font-size:13px;">데이터 불러오는 중...</span>
        </div>
    </div>

    <div class="roster-content">
        <div class="roster-title" id="rosterTitle">
            &nbsp;
        </div>
        <div class="roster-card">
            <table>
                <thead>
                    <tr>
                        <th style="width:60px;">번호</th>
                        <th>이름</th>
                        <th style="width:120px;">점수</th>
                        <th>AI 분석 키워드</th>
                    </tr>
                </thead>
                <tbody id="rosterBody">
                    <tr class="loading-row"><td colspan="4">데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="../backend/roster_logic.js"></script>
</body>
</html>
