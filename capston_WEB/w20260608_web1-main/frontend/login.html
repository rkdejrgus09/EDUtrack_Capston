<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <title>에듀트랙 - 교사 대시보드 로그인</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login_style.css">

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() { emailjs.init("AOdCTz3PgROEk3qI0"); })();
    </script>
</head>
<body>

<div class="container" id="container">

    <!-- 회원가입 패널 (기본: 왼쪽, 숨김) -->
    <div class="form-container sign-up-container">
        <div id="signup-section" class="form-inner">
            <h1>회원가입</h1>
            <p>에듀트랙 교사 계정 등록</p>
            <input type="text" id="signup-name" placeholder="이름 (실명)" autocomplete="name">
            <input type="email" id="signup-email" placeholder="이메일" autocomplete="email">
            <div class="auth-group">
                <input type="text" id="auth-code" placeholder="인증번호 입력">
                <button class="inner-btn" id="sendAuthBtn" type="button">인증번호 보내기</button>
            </div>
            <div class="file-group">
                <label class="file-label" for="teacher-auth-file">교사 인증 서류 첨부 (재직증명서 등)</label>
                <input type="file" id="teacher-auth-file" accept=".pdf,.jpg,.jpeg,.png">
                <span style="font-size:11px; color:#aaa; margin-top:4px; display:block;">JPG, PNG, PDF · 최대 2MB</span>
            </div>
            <input type="password" id="signup-pw" placeholder="비밀번호 설정">
            <input type="password" id="signup-pw-confirm" placeholder="비밀번호 확인">
            <div id="signup-notice" class="notice-text">*관리자의 가입 승인 후 이용 가능합니다.</div>
            <button class="btn-primary" id="signupBtn">회원가입 완료</button>
        </div>
    </div>

    <!-- 로그인 패널 (기본: 오른쪽, 표시) -->
    <div class="form-container sign-in-container">
        <div id="login-section" class="form-inner">
            <h1>로그인</h1>
            <p>교사 및 관리자 웹 대시보드</p>
            <div class="input-group">
                <input type="email" id="email" placeholder="이메일" autocomplete="email" oninput="toggleClearBtn(this)">
                <button type="button" class="input-icon clear-btn" onclick="clearInput(this, 'email')" aria-label="입력 내용 지우기" style="display:none;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M15 9l-6 6M9 9l6 6"/>
                    </svg>
                </button>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password">
                <button type="button" class="input-icon toggle-pw" onclick="togglePwVisibility(this, 'password')" aria-label="비밀번호 표시">
                    <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <path d="M3 3l18 18"/>
                        <path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/>
                        <path d="M9.4 5.3A9.5 9.5 0 0 1 12 5c7 0 10.5 7 10.5 7a17 17 0 0 1-3.3 4.1"/>
                        <path d="M6.1 6.7A17.4 17.4 0 0 0 1.5 12S5 19 12 19a9.7 9.7 0 0 0 3.3-.6"/>
                    </svg>
                </button>
            </div>
            <span class="forgot-link" onclick="toggleSection('forgot-pw')">비밀번호를 잊으셨나요?</span>
            <button class="btn-primary" id="loginBtn">로그인</button>
        </div>
        <div id="forgot-pw-section" class="form-inner" style="display:none;">
            <h1>비밀번호 찾기</h1>
            <p>가입하신 이메일로<br>재설정 링크를 보내드립니다.</p>
            <div class="input-group">
                <input type="email" id="reset-email" placeholder="가입한 이메일 주소">
                <span class="input-icon">✉</span>
            </div>
            <button class="btn-primary" id="resetPwBtn">재설정 링크 발송</button>
            <span class="forgot-link back-link" onclick="toggleSection('login')">← 로그인으로 돌아가기</span>
        </div>
    </div>

    <!-- 오버레이 (슬라이딩 파란 패널) -->
    <div class="overlay-container">
        <div class="overlay">
            <!-- 왼쪽 패널: 회원가입 모드일 때 표시 -->
            <div class="overlay-panel overlay-left">
                <div class="overlay-logo">EduTrack</div>
                <h1>Welcome Back!</h1>
                <p>이미 계정이 있으신가요?<br>로그인하여 수업을 시작하세요.</p>
                <button class="ghost" onclick="toggleSection('login')">로그인하기</button>
            </div>
            <!-- 오른쪽 패널: 로그인 모드일 때 표시 -->
            <div class="overlay-panel overlay-right">
                <div class="overlay-logo">EduTrack</div>
                <h1>Hello, Welcome!</h1>
                <p>아직 계정이 없으신가요?<br>지금 바로 가입하세요.</p>
                <button class="ghost" onclick="toggleSection('signup')">회원가입하기</button>
            </div>
        </div>
    </div>

</div>

<script>
    // 비밀번호 표시/숨김 토글 (눈 아이콘)
    window.togglePwVisibility = function(btnEl, inputId) {
        const input = document.getElementById(inputId);
        if (!input) return;
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btnEl.querySelector('.eye-open').style.display = show ? 'none' : '';
        btnEl.querySelector('.eye-closed').style.display = show ? '' : 'none';
        btnEl.setAttribute('aria-label', show ? '비밀번호 숨김' : '비밀번호 표시');
    };

    // 입력칸 지우기(X) 버튼 — 1글자 이상 입력 시 표시
    window.toggleClearBtn = function(inputEl) {
        const btn = inputEl.parentElement.querySelector('.clear-btn');
        if (btn) btn.style.display = inputEl.value.length > 0 ? '' : 'none';
    };
    window.clearInput = function(btnEl, inputId) {
        const input = document.getElementById(inputId);
        if (!input) return;
        input.value = '';
        btnEl.style.display = 'none';
        input.focus();
        input.dispatchEvent(new Event('input', { bubbles: true }));
    };
</script>

<script>
    // 모듈의 window.toggleSection 할당을 가로채서 슬라이딩 애니메이션과 연동
    let _origToggle = null;
    Object.defineProperty(window, 'toggleSection', {
        set(fn) { _origToggle = fn; },
        get() {
            return function(type) {
                if (_origToggle) _origToggle(type);
                const c = document.getElementById('container');
                if (type === 'signup') c.classList.add('right-panel-active');
                else c.classList.remove('right-panel-active');
            };
        },
        configurable: true
    });
</script>

<script type="module" src="../backend/login_logic.js"></script>
</body>
</html>
